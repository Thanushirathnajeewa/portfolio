<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#191d29"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2a65a"/>
      <stop offset="100%" stop-color="#d9843a"/>
    </linearGradient>
    <clipPath id="steamClip">
      <rect x="0" y="0" width="640" height="400"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- faint grid, echoing a code/terminal surface -->
  <g stroke="#242938" stroke-width="1">
    <line x1="0" y1="100" x2="640" y2="100"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
  </g>

  <!-- app window chrome (Windows Forms nod) -->
  <g>
    <rect x="72" y="64" width="496" height="272" rx="10" fill="#1b1f2b" stroke="#2c3242" stroke-width="1.5"/>
    <rect x="72" y="64" width="496" height="34" rx="10" fill="#232838"/>
    <rect x="72" y="90" width="496" height="8" fill="#232838"/>
    <circle cx="94" cy="81" r="5" fill="#f2a65a"/>
    <circle cx="112" cy="81" r="5" fill="#7c9cff"/>
    <circle cx="130" cy="81" r="5" fill="#4dd0b5"/>
    <text x="320" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5c6478">CafeManager.exe — Order</text>
  </g>

  <!-- menu / order list (left pane) -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#aeb4c4">
    <rect x="94" y="116" width="252" height="26" rx="4" fill="#20263450"/>
    <text x="104" y="133">Cappuccino</text>
    <text x="316" y="133" text-anchor="end" fill="#7c9cff">x2</text>

    <rect x="94" y="150" width="252" height="26" rx="4" fill="#20263450"/>
    <text x="104" y="167">Blueberry Muffin</text>
    <text x="316" y="167" text-anchor="end" fill="#7c9cff">x1</text>

    <rect x="94" y="184" width="252" height="26" rx="4" fill="#20263450"/>
    <text x="104" y="201">Iced Latte</text>
    <text x="316" y="201" text-anchor="end" fill="#7c9cff">x1</text>

    <line x1="94" y1="222" x2="346" y2="222" stroke="#2c3242" stroke-width="1"/>
    <text x="104" y="244" fill="#e7e9ef" font-size="14">Total</text>
    <text x="316" y="244" text-anchor="end" fill="#4dd0b5" font-size="14">Rs. 1,450.00</text>

    <rect x="94" y="264" width="140" height="30" rx="6" fill="#7c9cff"/>
    <text x="164" y="284" text-anchor="middle" fill="#12141c" font-size="12" font-weight="600">CHARGE</text>

    <rect x="242" y="264" width="104" height="30" rx="6" fill="none" stroke="#3a4156" stroke-width="1.5"/>
    <text x="294" y="284" text-anchor="middle" fill="#8b93a7" font-size="12">VOID</text>
  </g>

  <!-- divider -->
  <line x1="378" y1="116" x2="378" y2="294" stroke="#2c3242" stroke-width="1"/>

  <!-- coffee cup illustration (right pane) -->
  <g transform="translate(392,110)">
    <!-- steam -->
    <g stroke="#3a4156" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M30 8 C 24 16, 36 20, 30 30" />
      <path d="M52 8 C 46 16, 58 20, 52 30" />
    </g>
    <!-- cup body -->
    <path d="M8 40 h64 l-6 66 a10 10 0 0 1-10 9 H34 a10 10 0 0 1-10-9 Z" fill="url(#cup)"/>
    <!-- cup rim -->
    <rect x="4" y="34" width="72" height="12" rx="6" fill="#f6b978"/>
    <!-- handle -->
    <path d="M76 50 h10 a14 14 0 0 1 0 28 h-8" fill="none" stroke="#f2a65a" stroke-width="8" stroke-linecap="round"/>
    <!-- saucer shadow -->
    <ellipse cx="40" cy="122" rx="46" ry="8" fill="#0c0e14"/>
  </g>

  <!-- receipt strip -->
  <g transform="translate(470,150)">
    <rect x="0" y="0" width="70" height="96" fill="#e7e9ef"/>
    <g stroke="#c7cbd6" stroke-width="2">
      <line x1="10" y1="16" x2="60" y2="16"/>
      <line x1="10" y1="28" x2="60" y2="28"/>
      <line x1="10" y1="40" x2="44" y2="40"/>
      <line x1="10" y1="56" x2="60" y2="56"/>
      <line x1="10" y1="68" x2="50" y2="68"/>
    </g>
    <path d="M0 96 l7 8 l7 -8 l7 8 l7 -8 l7 8 l7 -8 l7 8 l7 -8 l7 8 l7 -8" fill="#e7e9ef"/>
  </g>

  <!-- brand-echo blinking cursor, tying it back to the site's own mark -->
  <g font-family="'JetBrains Mono', monospace" font-size="13">
    <text x="94" y="322" fill="#5c6478">/projects/quick-service-cafe-manager</text>
    <rect x="330" y="311" width="8" height="14" fill="#4dd0b5">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
