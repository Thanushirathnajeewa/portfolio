<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="120" fill="#121B2E"/>
  <rect x="0.5" y="0.5" width="199" height="119" fill="none" stroke="#24314B"/>
  <!-- browser window -->
  <rect x="24" y="20" width="152" height="80" rx="6" fill="#0B1220" stroke="#24314B"/>
  <!-- title bar -->
  <rect x="24" y="20" width="152" height="16" rx="6" fill="#182238"/>
  <circle cx="34" cy="28" r="3" fill="#F26D6D" opacity="0.8"/>
  <circle cx="44" cy="28" r="3" fill="#F2C14E" opacity="0.8"/>
  <circle cx="54" cy="28" r="3" fill="#5EEAD4" opacity="0.8"/>
  <!-- nav bar -->
  <rect x="34" y="44" width="20" height="6" rx="1" fill="#5EEAD4"/>
  <rect x="60" y="44" width="16" height="6" rx="1" fill="#8B96A8" opacity="0.6"/>
  <rect x="82" y="44" width="16" height="6" rx="1" fill="#8B96A8" opacity="0.6"/>
  <rect x="104" y="44" width="16" height="6" rx="1" fill="#8B96A8" opacity="0.6"/>
  <!-- hero text lines -->
  <rect x="34" y="62" width="70" height="6" rx="1" fill="#E7ECF3"/>
  <rect x="34" y="72" width="100" height="4" rx="1" fill="#8B96A8" opacity="0.6"/>
  <rect x="34" y="80" width="80" height="4" rx="1" fill="#8B96A8" opacity="0.6"/>
  <!-- cursor block -->
  <rect x="118" y="61" width="7" height="8" fill="#5EEAD4">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- button -->
  <rect x="34" y="88" width="34" height="8" rx="4" fill="#5EEAD4" opacity="0.85"/>
</svg>
